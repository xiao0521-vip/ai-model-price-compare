# ============================================================
# 每日自动更新模型价格
# ============================================================
# 触发方式：
#   1. 定时：工作日 08:00 UTC (北京 16:00) 自动运行
#   2. 手动：Actions → Daily Price Update → Run workflow
#
# 工作方式（v3：直接提交，不再走 PR）：
#   checkout → 同步到最新 main → npm ci → 抓价 → 体检 → 有变更才 commit+push
#   push 后 Cloudflare Pages 的 Git 集成会自动重新部署。
#
# ⚠️ 为什么必须有「Sync to latest」这一步：
#   workflow_dispatch 会把 github.sha 固定为「派发那一刻」的提交。若派发后
#   main 又前进过（例如本地修完推上去），CI 就基于旧提交打包，commit 后
#   push 会被拒：
#       ! [rejected] HEAD -> main (non-fast-forward)
#   2026-09-19 run #3 因此失败（抓价与体检都已通过，只差落地）。
#   在 Checkout 之后强制 reset 到 origin/main，从根上消除该问题。
#
# ⚠️ 前置设置（否则 push 会 403）：
#   Settings → Actions → General → Workflow permissions
#   选 "Read and write permissions" 并 Save。
#
# 诊断设计：
#   每个 run 步骤都把 stdout/stderr 同时写到 Step Summary，
#   打开 Actions 运行页的 Summary 标签即可看到全部日志，无需逐个展开。
#
# 可选 Secrets：
#   SILICONFLOW_API_KEY  - 硅基流动 API 密钥（推荐，有官方模型列表接口）
#   OPENAI_API_KEY       - OpenAI API 密钥（可选，仅用于校验模型列表）
#   ANTHROPIC_API_KEY    - Anthropic API 密钥（可选）
#   CF_DEPLOY_HOOK       - Cloudflare Pages Deploy Hook 完整 URL（可选）
# ============================================================
name: Daily Price Update

on:
  schedule:
    # 每天 08:00 UTC = 北京 16:00（含周末；无价格变化时自动跳过提交，不会产生空提交）
    - cron: '0 8 * * *'
  workflow_dispatch:

# 同一时间只允许一个更新任务，避免并发写冲突
concurrency:
  group: price-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}

    steps:
      # 1) 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1b) 强制同步到远程最新 main —— 消除「基于旧提交打包 → push 被拒」
      - name: Sync to latest main
        run: |
          set +e
          {
            echo "同步前：$(git log --oneline -1)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            echo "同步后：$(git log --oneline -1)"
          } > /tmp/sync.log 2>&1
          CODE=$?
          cat /tmp/sync.log
          { echo ""; echo "### 🔄 同步到最新 main"; echo '```'; cat /tmp/sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 2) 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3) 安装依赖
      - name: Install dependencies
        run: |
          set +e
          npm ci --no-audit --no-fund > /tmp/npm.log 2>&1
          CODE=$?
          tail -n 40 /tmp/npm.log
          { echo ""; echo "### 📦 依赖安装"; echo '```'; tail -n 40 /tmp/npm.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 4) 执行价格抓取 + 修补 data.js + 同步 deploy/data.js
      - name: Fetch & update prices
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set +e
          node scripts/fetch-prices.js > /tmp/fetch.log 2>&1
          CODE=$?
          cat /tmp/fetch.log
          { echo ""; echo "### 🔄 抓价输出"; echo '```'; tail -n 120 /tmp/fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 4.5) 同步「接口能力」元数据（OpenRouter 的 input_modalities / supported_parameters）。
      #      与价格无关、失败不致命：拿不到就保留原值，所以这里 continue-on-error。
      - name: Sync capabilities
        continue-on-error: true
        run: |
          set +e
          node scripts/sync-caps.js --apply > /tmp/caps.log 2>&1
          CODE=$?
          cat /tmp/caps.log
          { echo ""; echo "### 🧩 接口能力同步"; echo '```'; tail -n 40 /tmp/caps.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 5) 数据体检：字段完整性 + 价格异常波动，不合格就中止，绝不推脏数据
      - name: Verify data.js
        run: |
          set +e
          node scripts/verify-data.js > /tmp/verify.log 2>&1
          CODE=$?
          cat /tmp/verify.log
          { echo ""; echo "### 🩺 数据体检"; echo '```'; cat /tmp/verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 6) 打印改动概览（无改动时为空）
      - name: Show diff
        run: |
          set +e
          git --no-pager diff --stat > /tmp/diff.log 2>&1
          cat /tmp/diff.log
          { echo ""; echo "### 📝 改动概览"; echo '```'; cat /tmp/diff.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 7) 有变更才提交并推送；推送被拒时自动 rebase 重试（兜住运行期间的竞态）
      - name: Commit & push
        id: commit
        run: |
          set +e
          BRANCH="${{ github.ref_name }}"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          {
            git config user.name  "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add -A
            if git diff --staged --quiet; then
              echo "✅ 价格无变化，跳过提交"
            else
              if git commit -m "chore(prices): auto-update $(date -u '+%Y-%m-%d')"; then
                PUSHED=0
                for i in 1 2 3; do
                  if git push origin "HEAD:$BRANCH"; then PUSHED=1; break; fi
                  echo "⚠ 第 $i 次推送被拒（可能有并发提交），拉取远程最新后重试…"
                  git pull --rebase --autostash origin "$BRANCH" || break
                done
                if [ "$PUSHED" = "1" ]; then
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "✅ 已提交并推送到 $BRANCH"
                else
                  echo "❌ 推送失败。请确认 Settings → Actions → General → Workflow permissions 已选 Read and write permissions。"
                  false
                fi
              else
                echo "❌ 提交失败"
                false
              fi
            fi
          } > /tmp/commit.log 2>&1
          CODE=$?
          cat /tmp/commit.log
          { echo ""; echo "### 📤 提交与推送"; echo '```'; cat /tmp/commit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 8) 可选：主动触发 Cloudflare Pages 构建
      - name: Trigger Cloudflare Pages deploy
        if: env.CF_DEPLOY_HOOK != ''
        continue-on-error: true
        run: |
          set +e
          curl -fsS -X POST "$CF_DEPLOY_HOOK" > /tmp/hook.log 2>&1
          CODE=$?
          cat /tmp/hook.log
          { echo ""; echo "### 🚀 触发 Pages 构建"; echo '```'; cat /tmp/hook.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      # 9) 运行摘要（在工作流页面顶部可见）
      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "## 📊 价格自动更新"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 运行编号 | #${{ github.run_number }} |"
            echo "| 执行时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 是否有变更 | ${{ steps.commit.outputs.changed || '无变更' }} |"
            echo "| Deploy Hook | ${{ env.CF_DEPLOY_HOOK != '' && '已配置' || '未配置（依赖 Git 集成自动构建）' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
